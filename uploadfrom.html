<!DOCTYPE html> 
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Graffiti Feltöltés</title>
<link rel="stylesheet" href="headerStyle.css">
<link rel="stylesheet" href="uploadStyle.css" />
</head>
<body>
<nav id="home-button">
  <a href="./">← Vissza a főoldalra</a>
</nav>

<h1>Feltöltés</h1>

<form id="uploadForm" onsubmit="upload(event)">
  <label>
    felirat:
    <input type="text" id="name" required placeholder="Felirat...">
  </label>

  <label>
    város:
    <input type="text" id="city" placeholder="Pl. Budapest">
  </label>

  <label>
    kerület:
    <input type="text" id="district" placeholder="Pl. VII.">
  </label>

  <label>
    utca:
    <input type="text" id="street" placeholder="Pl. Dob utca">
  </label>

  <label>
    év:
    <input type="number" id="year">
  </label>

  <label>
    képek:
    <input type="file" id="image" accept="image/*" multiple required>
  </label>

  <div id="category-select-div">
    <label>
      kategória:
      <div>
        <select class="select-category" id="first-category-select">
        </select>
      </div>
    </label>
  </div>
  <button id="category-select-btn" class="plus-icon">+</button>

  <div id="add-category-div">
    <label>
      új kategória hozzáadása:
      <div>
        <input type="text" class="add-category" placeholder="Kategória">
      </div>
    </label>
  </div>
  <button id="add-category-btn" class="plus-icon">+</button>

  <button type="submit" style="margin-top: 20px;">feltöltés</button>
</form>

<script type="module">
import { supabase } from './supabaseClient.js';

// --- SEGEDFUGGVENYEK ---
function sanitizeFileName(name) {
  return name.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, '-').replace(/[^a-zA-Z0-9\-_.]/g, '');
}
// Kép átméretezése és tömörítése (Max 1920px széles, 80%-os minőségű WebP)
function compressImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = (event) => {
      const img = new Image();
      img.src = event.target.result;
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const MAX_WIDTH = 1920; // Full HD elég bőven
        const scaleSize = MAX_WIDTH / img.width;
        
        // Csak akkor méretezzük át, ha nagyobb, mint a limit
        let width = img.width;
        let height = img.height;
        
        if (width > MAX_WIDTH) {
            width = MAX_WIDTH;
            height = img.height * scaleSize;
        }

        canvas.width = width;
        canvas.height = height;
        
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        
        // Átalakítás Blob-bá (WebP formátum, 0.8 minőség)
        canvas.toBlob((blob) => {
          if (!blob) {
             reject(new Error('Kép tömörítési hiba'));
             return;
          }
          // Az új blob objektumot adjuk vissza, ami már sokkal kisebb
          resolve(new File([blob], file.name.replace(/\.[^/.]+$/, ".webp"), {
            type: "image/webp",
            lastModified: Date.now(),
          }));
        }, 'image/webp', 0.8);
      };
      img.onerror = (err) => reject(err);
    };
    reader.onerror = (err) => reject(err);
  });
}
// Kategóriák betöltése a legördülőhöz
async function loadCategories() {
  const { data, error } = await supabase.from('category').select('id, category_name').order('category_name', { ascending: true });
  if (error) return console.error(error);

  const firstSelect = document.getElementById('first-category-select');
  firstSelect.innerHTML = ''; 
  const firstOption = document.createElement('option');
  firstOption.value = ''; firstOption.textContent = 'Nincs kiválasztva';
  firstSelect.appendChild(firstOption);

  data.forEach(cat => {
    const option = document.createElement('option');
    option.value = cat.id;
    option.textContent = cat.category_name;
    firstSelect.appendChild(option);
  });
}
loadCategories();

// UI eseménykezelők (Hozzáadás gombok)
document.getElementById('category-select-btn').addEventListener('click', e => {
  e.preventDefault();
  const newSelect = document.getElementById('first-category-select').cloneNode(true);
  newSelect.removeAttribute('id'); newSelect.value = ''; 
  const newDiv = document.createElement('div'); newDiv.appendChild(newSelect);
  document.getElementById('category-select-div').appendChild(newDiv);
});

document.getElementById('add-category-btn').addEventListener('click', e => {
  e.preventDefault();
  const newDiv = document.createElement('div');
  newDiv.innerHTML = `<input type="text" class="add-category" placeholder="Kategória">`;
  document.getElementById('add-category-div').appendChild(newDiv);
});

// Év mező beállítások
document.getElementById('year').placeholder = new Date().getFullYear();
document.getElementById('year').min = 1900;
document.getElementById('year').max = new Date().getFullYear();


// ==========================================
// FELTÖLTÉS LOGIKA (Duplikáció ellenőrzéssel)
// ==========================================
async function upload(e) {
  e.preventDefault();
  
  const name = document.getElementById('name').value.trim();
  const city = document.getElementById('city').value.trim();
  const district = document.getElementById('district').value.trim();
  const street = document.getElementById('street').value.trim();
  const year = document.getElementById('year').value ? parseInt(document.getElementById('year').value, 10) : null;
  const files = document.getElementById('image').files;

  // 1. Meglévő (Dropdownból választott) kategóriák ID-i
  let finalCategoryIDs = [];
  document.querySelectorAll('.select-category').forEach(s => { if(s.value) finalCategoryIDs.push(s.value); });

  // 2. Új kategóriák szövegei
  const newCategoryNames = [];
  document.querySelectorAll('.add-category').forEach(i => { if(i.value.trim()) newCategoryNames.push(i.value.trim()); });

  if (!name || !files.length) return alert('Hiányzó adatok!');

  // Slug és feltöltés előkészítése
  // 1. Megpróbáljuk a normál átalakítást (ékezetek levétele, szóközök kötőjellé, speciálisak törlése)
  let slug = name.toLowerCase()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .replace(/\s+/g, '-')
    .replace(/[^a-z0-9\-]/g, '');

  // 2. Eltávolítjuk a felesleges kötőjeleket a legelejéről és a legvégéről
  slug = slug.replace(/^-+|-+$/g, '');

  // 3. A "B-terv": Ha a slug teljesen üres lett (mert pl. csak "!!!" volt a név),
  // akkor kap egy egyedi azonosítót, hogy ne omoljon össze a rendszer.
  if (!slug) {
    slug = 'kivetelek-' + Date.now();
  }
  const { data: existing } = await supabase.from('graffiti').select('id').eq('slug', slug).maybeSingle();
  if (existing) return alert('Ez a név már létezik!');

  // Képek feltöltése
  // Képek feltöltése
  const imagePaths = [];
  for (let file of files) {
    try {
        // ITT TÖRTÉNIK A VARÁZSLAT: Tömörítés feltöltés előtt
        const compressedFile = await compressImage(file);
        
        // A fájlnevet is .webp-re cseréljük a biztonság kedvéért a generált path-ban
        const fileNameBase = sanitizeFileName(file.name).replace(/\.[^/.]+$/, ""); 
        const filePath = `uploads/${Date.now()}_${fileNameBase}.webp`;

        const { error: upErr } = await supabase.storage.from('graffiti-images').upload(filePath, compressedFile);
        
        if (upErr) {
             alert('Kép feltöltési hiba: ' + upErr.message);
             return; // Kilépünk hiba esetén
        }
        imagePaths.push(filePath);
        
    } catch (err) {
        console.error(err);
        alert("Hiba a kép feldolgozása közben: " + file.name);
        return;
    }
  }

  // --- OKOS KATEGÓRIA BESZÚRÁS ---
  if (newCategoryNames.length > 0) {
    // Lekérjük az ÖSSZES létező kategóriát ellenőrzéshez
    const { data: allCategories } = await supabase.from('category').select('id, category_name');

    const catsToInsert = [];
    
    for (const newName of newCategoryNames) {
        // Megnézzük, létezik-e már (kisbetű-nagybetű függetlenül)
        const existingCat = allCategories.find(c => c.category_name.toLowerCase() === newName.toLowerCase());

        if (existingCat) {
            // Ha létezik, csak felvesszük az ID-ját
            finalCategoryIDs.push(existingCat.id);
        } else {
            // Ha NEM létezik, akkor előkészítjük beszúrásra (ha még nincs a listában)
            if (!catsToInsert.some(c => c.category_name.toLowerCase() === newName.toLowerCase())) {
                catsToInsert.push({ category_name: newName });
            }
        }
    }

    // Beszúrjuk azokat, amik tényleg újak
    if (catsToInsert.length > 0) {
        const { data: insertedCats, error: catError } = await supabase
            .from('category')
            .insert(catsToInsert)
            .select();

        if (catError) return alert('Kategória hiba: ' + catError.message);
        
        // Hozzáadjuk az új ID-kat a listához
        insertedCats.forEach(c => finalCategoryIDs.push(c.id));
    }
  }

  // --- MENTÉS ---
  const { error } = await supabase.from('graffiti').insert([{
      name, 
      slug, 
      image_path: imagePaths, 
      year, 
      city, 
      district, 
      street, 
      accepted: true,
      category_id: finalCategoryIDs, // A végleges ID lista
      new_category: null // Üresen hagyjuk
  }]);

  if (error) return alert('DB hiba: ' + error.message);
  alert('Sikeres feltöltés!');
  location.href = './index.html';
}

window.upload = upload;
</script>
</body>
</html>
