<!DOCTYPE html> 
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Graffiti Feltöltés</title>
<link rel="stylesheet" href="uploadStyle.css" />
</head>
<body>
<h1>Graffiti Feltöltés</h1>

<form id="uploadForm" onsubmit="upload(event)">
  <label>
    Graffiti neve (Kötelező):
    <input type="text" id="name" required placeholder="Graffiti neve">
  </label>

  <label>
    Város (Kötelező):
    <input type="text" id="city" required placeholder="Pl. Budapest">
  </label>

  <label>
    Kerület (Opcionális):
    <input type="text" id="district" placeholder="Pl. VII.">
  </label>

  <label>
    Utca (Opcionális):
    <input type="text" id="street" placeholder="Pl. Dob utca">
  </label>

  <label>
    Leírás (Opcionális):
    <textarea id="description" rows="3" placeholder="Rövid leírás a graffitiről..."></textarea>
  </label>

  <label>
    Év (Opcionális):
    <input type="number" id="year">
  </label>

  <label>
    Képek (Kötelező):
    <input type="file" id="image" accept="image/*" multiple required>
  </label>

  <div id="category-select-div">
    Kategória (Opcionális):
    <div>
      <select class="select-category" id="first-category-select">
         </select>
    </div>
  </div>
  <button id="category-select-btn" class="plus-icon">+</button>

  <div id="add-category-div">
      Új kategória hozzáadása (Opcionális):
      <div>
        <input type="text" class="add-category" placeholder="Kategória">
      </div>
  </div>
  <button id="add-category-btn" class="plus-icon">+</button>

  <button type="submit" style="margin-top: 20px;">Feltöltés</button>
</form>

<script type="module">
import { supabase } from './supabaseClient.js';

// Kategóriák betöltése - CSAK AZ ELSŐBE töltjük be kezdetben
async function loadCategories() {
  const { data, error } = await supabase
    .from('category')
    .select('id, category_name')
    .order('category_name', { ascending: true });

  if (error) return console.error('Hiba a kategóriák lekérésekor:', error);

  // Csak az első select elemet célozzuk meg
  const firstSelect = document.getElementById('first-category-select');
  firstSelect.innerHTML = ''; // Biztonsági ürítés

  const firstOption = document.createElement('option');
  firstOption.value = '';
  firstOption.textContent = 'Nincs kiválasztva';
  firstSelect.appendChild(firstOption);

  data.forEach(cat => {
    const option = document.createElement('option');
    option.value = cat.id;
    option.textContent = cat.category_name;
    firstSelect.appendChild(option);
  });
}
loadCategories();

////////////////////////////////////////////////
// Kategória mező hozzáadása (MÁSOLÁSSAL)

document.getElementById('category-select-btn').addEventListener('click', e => {
  e.preventDefault();
  
  // Megkeressük az első selectet, ami már fel van töltve
  const sourceSelect = document.getElementById('first-category-select');
  
  // Klónozzuk a tartalmát (opciókat)
  const newSelect = sourceSelect.cloneNode(true);
  
  // Töröljük az ID-t a klónról (ne legyen duplikált ID) és reseteljük a kiválasztást
  newSelect.removeAttribute('id');
  newSelect.value = ''; 

  const newDiv = document.createElement('div');
  newDiv.appendChild(newSelect);
  
  document.getElementById('category-select-div').appendChild(newDiv);
});

document.getElementById('add-category-btn').addEventListener('click', e => {
  e.preventDefault();
  const addCatDiv = document.getElementById('add-category-div');
  
  const newDiv = document.createElement('div');
  newDiv.innerHTML = `<input type="text" class="add-category" placeholder="Kategória">`;
  addCatDiv.appendChild(newDiv);
});


//////////////////////////////////////////////////
// Év beállítások
document.getElementById('year').placeholder = new Date().getFullYear();
document.getElementById('year').min = 1900;
document.getElementById('year').max = new Date().getFullYear();


function sanitizeFileName(name) {
  return name
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .replace(/\s+/g, '-')
    .replace(/[^a-zA-Z0-9\-_.]/g, '');
}

async function upload(e) {
  e.preventDefault();
  
  // 1. Mezők beolvasása
  const name = document.getElementById('name').value.trim();
  const city = document.getElementById('city').value.trim();
  const district = document.getElementById('district').value.trim();
  const street = document.getElementById('street').value.trim();
  const description = document.getElementById('description').value.trim();
  
  const yearInput = document.getElementById('year').value;
  const year = yearInput ? parseInt(yearInput, 10) : null;
  
  const files = document.getElementById('image').files;

  // Kategóriák összegyűjtése
  const categoryIDs = []
  const categorySelects = document.querySelectorAll('.select-category');
  categorySelects.forEach(select => {
    if (select.value) categoryIDs.push(select.value);
  });

  const newCategories = [];
  const newCategoryInputs = document.querySelectorAll('.add-category');
  newCategoryInputs.forEach(input => {
    const val = input.value.trim();
    if (val) newCategories.push(val);
  });

  // 2. Validáció
  if (!name || !city || !files.length) {
      return alert('A Név, Város és legalább egy Kép megadása kötelező!');
  }

  const slug = name.toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9\-]/g,'');

  // Slug ellenőrzés
  const { data: existing } = await supabase
    .from('graffiti')
    .select('id')
    .eq('slug', slug)
    .maybeSingle();

  if (existing) return alert('Ez a név már létezik, válassz másikat.');

  // 3. Képek feltöltése
  const imagePaths = [];
  for (let file of files) {
    if (!file.type.startsWith('image/')) return alert('Csak képfájl!');
    if (file.size > 5*1024*1024) return alert('Max 5 MB/file.');

    const safeFileName = sanitizeFileName(file.name);
    const filePath = `uploads/${Date.now()}_${safeFileName}`;
    const { data: uploadData, error: uploadErr } = await supabase.storage
      .from('graffiti-images')
      .upload(filePath, file);

    if (uploadErr) return alert('Feltöltési hiba: ' + uploadErr.message);

    imagePaths.push(filePath);
  }

  // 4. Adatbázisba írás
  const { data, error } = await supabase
    .from('graffiti')
    .insert([{
      name: name,
      slug: slug,
      image_path: imagePaths,
      year: year,
      category_id: categoryIDs,
      new_category: newCategories,
      city: city,
      district: district,
      street: street,
      description: description,
      accepted: true
    }]);

  if (error) return alert('DB hiba: ' + error.message);

  alert('Sikeres feltöltés.');
  location.href = '/graffitis/index.html';
}

window.upload = upload;
</script>
</body>
</html>
