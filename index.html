<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="headerStyle.css">
<link rel="stylesheet" href="indexStyle.css">
<title>Kezdőlap</title>
<style>
  .active-filter {
      text-decoration: underline;
  }
  .expand-btn {
      font-weight: bold;
      cursor: pointer;
      color: #555; /* Opcionális: kicsit más szín a gomboknak */
  }
  .expand-btn:hover {
      color: #000;
  }
</style>
</head>
<body>
<header></header>

<div id="main-container">
  <div id="main-container-left">
    <div id="year-list"><h3>Év</h3></div>
    <div id="city-list"><h3>Város</h3></div>
    <div id="category-list"><h3>Kategória</h3></div>
  </div>

  <div id="main-container-right">
  </div>
</div>

<script type="module">
import { supabase } from './supabaseClient.js';
import isAdmin from './isAdmin.js';

window.logout = async function logout() {
  await supabase.auth.signOut();
  alert('Kijelentkeztél.');
  location.href = '/graffitis/index.html';
}

let graffitiData = [];
let categoryMap = {};
let activeFilter = { type: null, value: null };
let currentMode = 'alphabetical';

async function loadIndex() {
  const { data, error } = await supabase
    .from('graffiti')
    .select('id,name,slug,year,city,category_id,created_at')
    .eq('accepted', true)
    .order('name', { ascending: true });

  if (error) return console.error(error);
  graffitiData = data;

  const { data: catData, error: catError } = await supabase
    .from('category')
    .select('id, category_name');

  if (catError) return console.error(catError);
  catData.forEach(c => categoryMap[c.id] = c.category_name);

  // Listák generálása
  const yearList = document.getElementById('year-list');
  const cityList = document.getElementById('city-list');
  const categoryList = document.getElementById('category-list');

  const years = [...new Set(data.map(g => g.year).filter(Boolean))].sort((a,b)=>a-b);
  const cities = [...new Set(data.map(g => g.city).filter(Boolean))]
    .sort((a, b) => a.localeCompare(b, 'hu', { sensitivity: 'base' }));
  
  // Kategóriák rendezése
  const categories = [
    ...new Set(
      data.flatMap(g => g.category_id || []).map(id => categoryMap[id]).filter(Boolean)
    )
  ].sort((a, b) => a.localeCompare(b, 'hu', { sensitivity: 'base' }));

  years.forEach(y => createFilterBtn(y, 'year', yearList));
  cities.forEach(c => createFilterBtn(c, 'city', cityList));

  // --- MÓDOSÍTÁS: Dinamikus kategória renderelés (Nyitás/Zárás) ---
  
  const renderCategoryButtons = (isExpanded) => {
      // 1. Meglévő gombok törlése a listából (a H3 címet békén hagyjuk)
      const existingBtns = categoryList.querySelectorAll('span.filter-btn');
      existingBtns.forEach(btn => btn.remove());

      const CATEGORY_LIMIT = 20;
      
      // 2. Eldöntjük, mennyi elemet mutassunk
      // Ha nyitva van: összes, ha csukva: csak a limit
      const listToRender = isExpanded ? categories : categories.slice(0, CATEGORY_LIMIT);

      // 3. Gombok generálása
      listToRender.forEach(c => {
          createFilterBtn(c, 'category', categoryList);
      });

      // 4. Vezérlő gomb hozzáadása (... vagy X), ha több van mint a limit
      if (categories.length > CATEGORY_LIMIT) {
          const toggleBtn = document.createElement('span');
          toggleBtn.classList.add('filter-btn', 'expand-btn');
          
          if (isExpanded) {
              // Ha nyitva van -> Záró gomb (X)
              toggleBtn.innerText = 'X'; 
              toggleBtn.title = "Lista összecsukása";
              toggleBtn.addEventListener('click', () => renderCategoryButtons(false));
          } else {
              // Ha csukva van -> Nyitó gomb (...)
              toggleBtn.innerText = '...';
              toggleBtn.title = "Összes mutatása";
              toggleBtn.addEventListener('click', () => renderCategoryButtons(true));
          }
          categoryList.appendChild(toggleBtn);
      }

      // 5. Ha van aktív szűrő, azt újra meg kell jelölni (mert újrageneráltuk a DOM-ot)
      if (activeFilter.type === 'category' && activeFilter.value) {
          const activeBtn = Array.from(categoryList.querySelectorAll('.filter-btn'))
              .find(btn => btn.dataset.value === activeFilter.value);
          if (activeBtn) {
              activeBtn.classList.add('active-filter');
          }
      }
  };

  // Indítás alapállapotban (csukva)
  renderCategoryButtons(false);

  // --- MÓDOSÍTÁS VÉGE ---

  applyFilters();
  setupHeader();
}

function createFilterBtn(val, type, parent) {
    const btn = document.createElement('span');
    btn.classList.add('filter-btn');
    btn.dataset.filter = type;
    btn.dataset.value = val;
    btn.innerText = type === 'category' ? val.toUpperCase() : val;
    btn.addEventListener('click', handleFilterClick);
    parent.appendChild(btn);
}

// Navigációs gombok és header
async function setupHeader() {
    const header = document.querySelector('header');
    
    // Hamburger gomb létrehozása
    const hamburger = document.createElement('div');
    hamburger.id = 'hamburger-btn';
    hamburger.innerHTML = '<span></span><span></span><span></span>';
    hamburger.addEventListener('click', toggleMenu);
    header.appendChild(hamburger);

    // Fő navigációs konténer (ebben lesz minden menüpont)
    const navContainer = document.createElement('div');
    navContainer.id = 'nav-menu-container';
    
    // Felső rész (Login, Random, stb.)
    const navUpperRight = document.createElement('div'); 
    navUpperRight.id = 'nav-upper-right';
    
    // Admin check
    const adminLoggedIn = await isAdmin();

    const perDivider = document.createElement('div');
    perDivider.classList.add('nav-divider');
    perDivider.innerText = '/';
    
    const randomButton = document.createElement('div');
    randomButton.classList.add('nav-button');
    randomButton.innerHTML = '<nav><a onclick="goToRandomGraffiti(); closeMenu()">véletlenszerű</a></nav>';
    navUpperRight.appendChild(randomButton);
    navUpperRight.appendChild(perDivider.cloneNode(true));

    const lastButton = document.createElement('div');
    lastButton.classList.add('nav-button');
    lastButton.innerHTML = '<nav><a onclick="setLastMode(); closeMenu()">legutóbbi</a></nav>';
    navUpperRight.appendChild(lastButton);
    navUpperRight.appendChild(perDivider.cloneNode(true));

    const whatButton = document.createElement('div');
    whatButton.classList.add('nav-button');
    whatButton.innerHTML = '<nav><a onclick="openMiez();closeMenu()">mi ez</a></nav>'; 
    navUpperRight.appendChild(whatButton);

    if (!adminLoggedIn) {
        const loginButton = document.createElement('div');
        loginButton.classList.add('nav-button');
        loginButton.innerHTML = '<nav><a href="./login.html">///</a></nav>';
        navUpperRight.appendChild(loginButton);
    } else {
        const adminWrapper = document.createElement('div');
        adminWrapper.classList.add('admin-wrapper'); // Wrapper a stílusozáshoz
        
        const adminProfile = document.createElement('div');
        adminProfile.innerHTML = '<nav><a href="./admin.html">Admin</a></nav>';
        adminWrapper.appendChild(adminProfile);
        
        const logoutButton = document.createElement('div');
        logoutButton.innerHTML = '<nav><a onclick="logout()">×××</a></nav>';
        adminWrapper.appendChild(logoutButton);
        
        navUpperRight.appendChild(adminWrapper);
    }

    // Alsó rész (Feltöltés)
    const navLower = document.createElement('div'); 
    navLower.id = 'nav-lower';
    const uploadButton = document.createElement('div');
    uploadButton.id = 'upload-button';
    uploadButton.innerHTML = '<nav><a href="./upload.html">feltöltés</a></nav>';
    navLower.appendChild(uploadButton);

    // Mindent hozzáadunk a közös konténerhez
    navContainer.appendChild(navUpperRight);
    navContainer.appendChild(navLower);
    
    header.appendChild(navContainer);
}

// Menü nyitás/zárás funkciók
window.toggleMenu = function() {
    document.body.classList.toggle('menu-open');
}
window.openMiez = function() {
    location.href = '/graffitis/miez.html';
}
window.closeMenu = function() {
    document.body.classList.remove('menu-open');
}

window.goToRandomGraffiti = function() {
    if (graffitiData.length === 0) return alert('Nincs megjeleníthető graffiti.');
    const randomIndex = Math.floor(Math.random() * graffitiData.length);
    location.href = `graffiti.html?slug=${encodeURIComponent(graffitiData[randomIndex].slug)}`;
}

window.setLastMode = function() {
  currentMode = 'latest';
  applyFilters(); 
}

function handleFilterClick(e) {
  const btn = e.currentTarget;
  const type = btn.dataset.filter;
  const value = btn.dataset.value;

  if (activeFilter.type === type && activeFilter.value === value) {
      activeFilter = { type: null, value: null };
      btn.classList.remove('active-filter');
  } else {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active-filter'));
      activeFilter = { type: type, value: value };
      btn.classList.add('active-filter');
  }
  applyFilters();
}

function applyFilters() {
  const filtered = graffitiData.filter(g => {
    if (!activeFilter.type) return true;
    if (activeFilter.type === 'year') return g.year == activeFilter.value;
    if (activeFilter.type === 'city') return g.city == activeFilter.value;
    if (activeFilter.type === 'category') {
        const gCats = (g.category_id || []).map(id => categoryMap[id]).filter(Boolean);
        return gCats.includes(activeFilter.value);
    }
    return true;
  });
  renderList(filtered);
}

function renderList(list) {
    const container = document.getElementById('main-container-right');
    const mainContainer = document.getElementById('main-container');
    const filtersPanel = document.getElementById('main-container-left');
    const isMobile = window.innerWidth <= 900;

    // 1. LÉPÉS: Panel biztonságba helyezése
    if (container.contains(filtersPanel)) {
        mainContainer.insertBefore(filtersPanel, container);
    }
    
    // 2. LÉPÉS: Törlés
    container.innerHTML = '';
    container.style.height = 'auto'; 
    
    // 3. LÉPÉS: Panel elhelyezése
    if (isMobile) {
        container.appendChild(filtersPanel);
        container.style.columnCount = '2';
    } else {
        container.style.columnCount = '4';
    }

    // 4. LÉPÉS: Graffiti elemek generálása
    if (currentMode === 'alphabetical') {
        list.sort((a, b) => a.name.localeCompare(b.name, 'hu', { sensitivity: 'base' }));
        const groups = {};
        list.forEach(g => {
            const letter = (g.name || '?').trim().charAt(0).toUpperCase();
            (groups[letter] ||= []).push(g);
        });
        const sortedLetters = Object.keys(groups).sort((a, b) => a.localeCompare(b, 'hu', { sensitivity: 'base' }));

        sortedLetters.forEach(letter => {
            const groupDiv = document.createElement('div');
            groupDiv.classList.add('letter-group');
            
            const h3 = document.createElement('h3');
            h3.innerText = letter;
            groupDiv.appendChild(h3);

            const divider = document.createElement('hr');
            groupDiv.appendChild(divider);

            const ul = document.createElement('ul');
            groups[letter].forEach(item => {
                const li = document.createElement('li');
                const a = document.createElement('a');
                a.href = `graffiti.html?slug=${encodeURIComponent(item.slug)}`;
                
                if (item.name) {
                    a.innerText = item.name.charAt(0).toUpperCase() + item.name.slice(1);
                } else {
                    a.innerText = "Névtelen";
                }

                li.appendChild(a);
                ul.appendChild(li);
            });
            groupDiv.appendChild(ul);
            container.appendChild(groupDiv);
        });

    } else { // Latest mode
        let displayList = [...list];
        displayList.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

        displayList.forEach(item => {
            const div = document.createElement('div');
            div.classList.add('simple-item');
            const a = document.createElement('a');
            a.href = `graffiti.html?slug=${encodeURIComponent(item.slug)}`;
            
            if (item.name) {
                a.innerText = item.name.charAt(0).toUpperCase() + item.name.slice(1);
            } else {
                a.innerText = "Névtelen";
            }

            a.style.display = 'block';
            div.appendChild(a);
            container.appendChild(div);
        });
    }

    // 5. LÉPÉS: Magasság kalkuláció
    const rect = container.getBoundingClientRect();
    const windowHeight = window.innerHeight;
    let fixedHeight = Math.max(windowHeight - rect.top - 40, 300);
    
    if (isMobile) {
        const filterHeight = filtersPanel.getBoundingClientRect().height;
        fixedHeight += filterHeight;
    }

    container.style.columnFill = 'auto';
    container.style.height = `${fixedHeight}px`;

    let safetyCounter = 40;
    while (container.scrollWidth > container.clientWidth + 5 && safetyCounter > 0) {
        fixedHeight = fixedHeight * 1.2;
        container.style.height = `${fixedHeight}px`;
        safetyCounter--;
    }
}

window.addEventListener('DOMContentLoaded', loadIndex);
window.addEventListener('resize', () => { if (graffitiData.length) applyFilters(); });
</script>
</body>
</html>
