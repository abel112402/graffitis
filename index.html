<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="headerStyle.css">
<link rel="stylesheet" href="indexStyle.css">
<title>Kezdőlap</title>
<style>
  .active-filter {
      text-decoration: underline;
  }
</style>
</head>
<body>
<header></header>

<div id="main-container">
  <div id="main-container-left">
    <div id="year-list"><h3>Év</h3></div>
    <div id="city-list"><h3>Város</h3></div>
    <div id="category-list"><h3>Kategória</h3></div>
  </div>

  <div id="main-container-right">
  </div>
</div>

<script type="module">
import { supabase } from './supabaseClient.js';
import isAdmin from './isAdmin.js';

window.logout = async function logout() {
  await supabase.auth.signOut();
  alert('Kijelentkeztél.');
  location.href = '/graffitis/index.html';
}

let graffitiData = [];
let categoryMap = {};
let activeFilter = { type: null, value: null };
let currentMode = 'alphabetical';

async function loadIndex() {
  const { data, error } = await supabase
    .from('graffiti')
    .select('id,name,slug,year,city,category_id,created_at')
    .eq('accepted', true)
    .order('name', { ascending: true });

  if (error) return console.error(error);
  graffitiData = data;

  const { data: catData, error: catError } = await supabase
    .from('category')
    .select('id, category_name');

  if (catError) return console.error(catError);
  catData.forEach(c => categoryMap[c.id] = c.category_name);

  // Listák generálása
  const yearList = document.getElementById('year-list');
  const cityList = document.getElementById('city-list');
  const categoryList = document.getElementById('category-list');

  const years = [...new Set(data.map(g => g.year).filter(Boolean))].sort((a,b)=>a-b);
  const cities = [...new Set(data.map(g => g.city).filter(Boolean))]
    .sort((a, b) => a.localeCompare(b, 'hu', { sensitivity: 'base' }));
  const categories = [
    ...new Set(
      data.flatMap(g => g.category_id || []).map(id => categoryMap[id]).filter(Boolean)
    )
  ].sort((a, b) => a.localeCompare(b, 'hu', { sensitivity: 'base' }));

  years.forEach(y => createFilterBtn(y, 'year', yearList));
  cities.forEach(c => createFilterBtn(c, 'city', cityList));
  categories.forEach(c => createFilterBtn(c, 'category', categoryList));

  applyFilters();
  setupHeader();
}

function createFilterBtn(val, type, parent) {
    const btn = document.createElement('span');
    btn.classList.add('filter-btn');
    btn.dataset.filter = type;
    btn.dataset.value = val;
    btn.innerText = type === 'category' ? val.toUpperCase() : val;
    btn.addEventListener('click', handleFilterClick);
    parent.appendChild(btn);
}

// Navigációs gombok és header
async function setupHeader() {
  const navUpper = document.createElement('div'); navUpper.id = 'nav-upper';
  const navUpperLeft = document.createElement('div'); navUpperLeft.id = 'nav-upper-left';
  const navUpperRight = document.createElement('div'); navUpperRight.id = 'nav-upper-right';
  navUpper.appendChild(navUpperLeft); navUpper.appendChild(navUpperRight);
  const navLower = document.createElement('div'); navLower.id = 'nav-lower';

  const adminLoggedIn = await isAdmin();

  const randomButton = document.createElement('div');
  randomButton.classList.add('nav-button');
  randomButton.innerHTML = '<nav><a onclick="goToRandomGraffiti()">véletlenszerű</a></nav>';
  navUpperLeft.appendChild(randomButton);

  const lastButton = document.createElement('div');
  lastButton.classList.add('nav-button');
  lastButton.innerHTML = '<nav><a onclick="setLastMode()">legutóbbi</a></nav>';
  navUpperLeft.appendChild(lastButton);

  const whatButton = document.createElement('div');
  whatButton.classList.add('nav-button');
  whatButton.innerHTML = '<nav><a onclick="">mi ez</a></nav>';
  navUpperRight.appendChild(whatButton);

  if (!adminLoggedIn) {
    const loginButton = document.createElement('div');
    loginButton.innerHTML = '<nav><a href="./login.html">///</a></nav>';
    navUpper.appendChild(loginButton);
  } else {
    const adminProfile = document.createElement('div');
    adminProfile.innerHTML = '<nav><a href="./admin.html">Admin</a></nav>';
    navUpper.appendChild(adminProfile);
    const logoutButton = document.createElement('div');
    logoutButton.innerHTML = '<nav><a onclick="logout()">×××</a></nav>';
    navUpper.appendChild(logoutButton);
  }

  const uploadButton = document.createElement('div');
  uploadButton.id = 'upload-button';
  uploadButton.innerHTML = '<nav><a href="./upload.html">feltöltés</a></nav>';
  navLower.appendChild(uploadButton);

  document.querySelector('header').appendChild(navUpper);
  document.querySelector('header').appendChild(navLower);
}

window.goToRandomGraffiti = function() {
    if (graffitiData.length === 0) return alert('Nincs megjeleníthető graffiti.');
    const randomIndex = Math.floor(Math.random() * graffitiData.length);
    location.href = `graffiti.html?slug=${encodeURIComponent(graffitiData[randomIndex].slug)}`;
}

window.setLastMode = function() {
  currentMode = 'latest';
  applyFilters(); 
}

function handleFilterClick(e) {
  const btn = e.currentTarget;
  const type = btn.dataset.filter;
  const value = btn.dataset.value;

  if (activeFilter.type === type && activeFilter.value === value) {
      activeFilter = { type: null, value: null };
      btn.classList.remove('active-filter');
  } else {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active-filter'));
      activeFilter = { type: type, value: value };
      btn.classList.add('active-filter');
  }
  applyFilters();
}

function applyFilters() {
  const filtered = graffitiData.filter(g => {
    if (!activeFilter.type) return true;
    if (activeFilter.type === 'year') return g.year == activeFilter.value;
    if (activeFilter.type === 'city') return g.city == activeFilter.value;
    if (activeFilter.type === 'category') {
        const gCats = (g.category_id || []).map(id => categoryMap[id]).filter(Boolean);
        return gCats.includes(activeFilter.value);
    }
    return true;
  });
  renderList(filtered);
}

// ---- MÓDOSÍTOTT RENDERLIST FÜGGVÉNY A MOBIL NÉZETHEZ ----
function renderList(list) {
    const container = document.getElementById('main-container-right');
    const mainContainer = document.getElementById('main-container');
    const filtersPanel = document.getElementById('main-container-left');
    const isMobile = window.innerWidth <= 900;

    // 1. LÉPÉS: A szűrő panelt biztonságba helyezzük a törlés előtt
    // Ha a containerben van (mert mobilon vagyunk), vegyük ki onnan
    if (container.contains(filtersPanel)) {
        mainContainer.insertBefore(filtersPanel, container);
    }
    
    // 2. LÉPÉS: Törlés és alaphelyzet
    container.innerHTML = '';
    container.style.height = 'auto'; 
    
    // 3. LÉPÉS: Panel elhelyezése a nézettől függően
    if (isMobile) {
        // Mobilon: A szűrő panel bekerül a lista konténerbe (az elejére)
        // Így az első oszlop tetején lesz
        container.appendChild(filtersPanel);
        container.style.columnCount = '2'; // 2 oszlop kényszerítése
    } else {
        // Desktopon: A szűrő panel marad a fő konténerben, a lista előtt (visszakerül a helyére)
        // Ezt a lépést már megtettük az 1. lépésben, de biztosítjuk a Desktop oszlopokat
        container.style.columnCount = '5';
    }

    // 4. LÉPÉS: Graffiti elemek generálása (ugyanaz, mint eddig)
    if (currentMode === 'alphabetical') {
        list.sort((a, b) => a.name.localeCompare(b.name, 'hu', { sensitivity: 'base' }));
        const groups = {};
        list.forEach(g => {
            const letter = (g.name || '?').trim().charAt(0).toUpperCase();
            (groups[letter] ||= []).push(g);
        });
        const sortedLetters = Object.keys(groups).sort((a, b) => a.localeCompare(b, 'hu', { sensitivity: 'base' }));

        sortedLetters.forEach(letter => {
            const groupDiv = document.createElement('div');
            groupDiv.classList.add('letter-group');
            
            const h3 = document.createElement('h3');
            h3.innerText = letter;
            groupDiv.appendChild(h3);

            const divider = document.createElement('hr');
            groupDiv.appendChild(divider);

            const ul = document.createElement('ul');
            groups[letter].forEach(item => {
                const li = document.createElement('li');
                const a = document.createElement('a');
                a.href = `graffiti.html?slug=${encodeURIComponent(item.slug)}`;
                a.innerText = item.name;
                li.appendChild(a);
                ul.appendChild(li);
            });
            groupDiv.appendChild(ul);
            container.appendChild(groupDiv);
        });

    } else { // Latest mode
        let displayList = [...list];
        displayList.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

        displayList.forEach(item => {
            const div = document.createElement('div');
            div.classList.add('simple-item');
            const a = document.createElement('a');
            a.href = `graffiti.html?slug=${encodeURIComponent(item.slug)}`;
            a.innerText = item.name;
            a.style.display = 'block';
            div.appendChild(a);
            container.appendChild(div);
        });
    }

    // 5. LÉPÉS: Magasság kalkuláció (Duplázás)
    // Csak a magasságot számoljuk, az oszlopok száma már be van állítva (2 vagy 5)
    
    // Alap magasság számítása
    const rect = container.getBoundingClientRect();
    const windowHeight = window.innerHeight;
    let fixedHeight = Math.max(windowHeight - rect.top - 40, 300);
    
    // Ha mobilon vagyunk, hozzá kell adni a szűrő panel magasságát is a becsléshez,
    // különben túl kicsi lesz a kezdő magasság és sokat kell duplázni
    if (isMobile) {
        const filterHeight = filtersPanel.getBoundingClientRect().height;
        fixedHeight += filterHeight;
    }

    container.style.columnFill = 'auto';
    container.style.height = `${fixedHeight}px`;

    // Duplázás ha kifolyik
    let safetyCounter = 10;
    while (container.scrollWidth > container.clientWidth + 5 && safetyCounter > 0) {
        fixedHeight = fixedHeight * 2;
        container.style.height = `${fixedHeight}px`;
        safetyCounter--;
    }
}

window.addEventListener('DOMContentLoaded', loadIndex);
window.addEventListener('resize', () => { if (graffitiData.length) applyFilters(); });
</script>
</body>
</html>
