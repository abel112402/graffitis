<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Kép Optimalizáló (Javítás)</title>
<style>
  body { font-family: monospace; background: #222; color: #eee; padding: 20px; }
  button { padding: 15px 30px; font-size: 18px; cursor: pointer; background: #e94e77; color: white; border: none; }
  button:disabled { background: #555; cursor: not-allowed; }
  #log { margin-top: 20px; white-space: pre-wrap; height: 400px; overflow-y: scroll; border: 1px solid #444; padding: 10px; background: #111; }
  .success { color: #4caf50; }
  .error { color: #f44336; }
  .info { color: #2196f3; }
</style>
</head>
<body>

<h1>⚠️ Kép Optimalizáló Script</h1>
<p>Ez a script letölti az összes képet, tömöríti, és FELÜLÍRJA az eredetit a Storage-ban.</p>
<button id="start-btn" onclick="startOptimization()">🚀 Összes kép optimalizálása indítása</button>
<div id="log">A napló itt fog megjelenni...</div>

<script type="module">
import { supabase } from './supabaseClient.js';

const logDiv = document.getElementById('log');
function log(msg, type = '') {
  const div = document.createElement('div');
  div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
  if(type) div.className = type;
  logDiv.prepend(div);
}

// 1. TÖMÖRÍTŐ FÜGGVÉNY (Blob bemenettel)
function compressBlob(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.readAsDataURL(blob);
    reader.onload = (event) => {
      const img = new Image();
      img.src = event.target.result;
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const MAX_WIDTH = 1920; 
        const scaleSize = MAX_WIDTH / img.width;
        
        let width = img.width;
        let height = img.height;
        
        if (width > MAX_WIDTH) {
            width = MAX_WIDTH;
            height = img.height * scaleSize;
        }

        canvas.width = width;
        canvas.height = height;
        
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        
        // WebP, 0.8 minőség
        canvas.toBlob((newBlob) => {
          if (!newBlob) reject(new Error('Tömörítési hiba'));
          resolve(newBlob);
        }, 'image/webp', 0.8);
      };
      img.onerror = (err) => reject(err);
    };
  });
}

// 2. FŐ FOLYAMAT
window.startOptimization = async () => {
  const btn = document.getElementById('start-btn');
  btn.disabled = true;
  btn.innerText = "⏳ Folyamatban... (Ne zárd be)";
  log("Adatok lekérése az adatbázisból...", 'info');

  // Lekérjük az összes graffiti rekordot
  const { data: records, error } = await supabase
    .from('graffiti')
    .select('id, name, image_path');

  if (error) {
    log("Hiba a lekérésnél: " + error.message, 'error');
    btn.disabled = false;
    return;
  }

  // Összegyűjtjük az összes fájl útvonalat egy lapos listába
  let allPaths = [];
  records.forEach(r => {
    if (r.image_path && Array.isArray(r.image_path)) {
      allPaths.push(...r.image_path);
    }
  });

  // Duplikációk szűrése (ha lenne)
  allPaths = [...new Set(allPaths)];
  
  log(`Összesen ${allPaths.length} db kép található. Feldolgozás indítása...`, 'info');

  let successCount = 0;
  let failCount = 0;

  // SORBAN haladunk, hogy ne fagyjon le a böngésző
  for (const path of allPaths) {
    try {
      log(`--- Feldolgozás: ${path} ---`);

      // 1. Letöltés
      const { data: originalBlob, error: dlError } = await supabase.storage
        .from('graffiti-images')
        .download(path);

      if (dlError) throw new Error("Letöltési hiba: " + dlError.message);

      // Ellenőrzés: Ha már WebP és kicsi, akkor átugorhatjuk (opcionális, de most mindent átnyomunk a biztonság kedvéért)
      // Vagy ha nagyon kicsi (<300KB), akkor talán nem kell bántani. 
      if (originalBlob.size < 300000) {
         log(`⏩ A kép már elég kicsi (${Math.round(originalBlob.size/1024)} KB), kihagyva.`, 'info');
         continue;
      }

      log(`Eredeti méret: ${(originalBlob.size / 1024 / 1024).toFixed(2)} MB. Tömörítés...`);

      // 2. Tömörítés
      const compressedBlob = await compressBlob(originalBlob);
      log(`Új méret: ${(compressedBlob.size / 1024).toFixed(2)} KB. Feltöltés...`, 'info');

      // 3. Visszatöltés (Felülírás: upsert: true)
      // FONTOS: contentType: 'image/webp' beállítása, még akkor is, ha a fájlnév .jpg marad!
      const { error: upError } = await supabase.storage
        .from('graffiti-images')
        .upload(path, compressedBlob, { 
            upsert: true, 
            contentType: 'image/webp',
            cacheControl: '3600' 
        });

      if (upError) throw new Error("Feltöltési hiba: " + upError.message);

      log(`✅ Siker: ${path}`, 'success');
      successCount++;

    } catch (err) {
      log(`❌ HIBA ennél: ${path} - ${err.message}`, 'error');
      failCount++;
    }
  }

  log(`🏁 KÉSZ! Sikeres: ${successCount}, Hiba: ${failCount}`, 'info');
  btn.innerText = "Kész";
};
</script>

</body>
</html>
