<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Graffiti részletek</title>
<link rel="stylesheet" href="graffitiStyle.css" />
</head>
<body>

<nav id="home-button">
  <a href="./">← Vissza a főoldalra</a>
</nav>

<div id="admin-actions"></div>
<div id="images"></div>
<h1 id="title">Betöltés...</h1>
<div id="add-year-div"><div id="address-display"></div><div id="year-display"></div></div>
<div id="expand-div"><a id="expend-btn">...</a></div>
<div id="category-display" class="hidden"></div>
<div id="description-display" class="hidden" style="display: none;"></div>



<script type="module">
import { supabase } from './supabaseClient.js';

async function checkAdmin() {
  const { data: { user } } = await supabase.auth.getUser();
  if (!user) return false;

  const { data } = await supabase
    .from('admins')
    .select('user_id')
    .eq('user_id', user.id);

  return data && data.length > 0;
}

async function loadDetail() {
  const slug = new URLSearchParams(location.search).get('slug');
  if (!slug) { document.body.innerText = 'Nincs megadva.'; return; }

  const { data, error } = await supabase
    .from('graffiti')
    .select('id, name, image_path, year, category_id, city, district, street')
    .eq('slug', slug)
    .maybeSingle();

  if (error || !data) { document.body.innerText = 'Nincs ilyen graffiti.'; return; }

  // 1. Cím
  const addressParts = [data.city, data.district, data.street].filter(Boolean).map(part => part.trim().toUpperCase());;
  const addressElement = document.getElementById('address-display');
  if (data.year) {
    addressElement.textContent = addressParts.length > 0 
      ? `${addressParts.join(', ')},` 
      : 'Helyszín: Ismeretlen';
  } else {
    addressElement.textContent = addressParts.length > 0 
          ? `${addressParts.join(', ')}` 
          : 'Helyszín: Ismeretlen';
  }
  

  // 2. Alapadatok
  document.getElementById('title').innerText = data.name.charAt(0).toUpperCase() + data.name.slice(1);
  document.getElementById('year-display').innerText = data.year ? `${data.year}` : '';

  // 3. Leírás
  if (data.description) {
    const descDiv = document.getElementById('description-display');
  }

  // 4. Kategóriák
  const catDiv = document.getElementById('category-display');
  if (data.category_id) {
    for (const catId of data.category_id) {
      const { data: catData } = await supabase
        .from('category')
        .select('category_name')
        .eq('id', catId)
        .maybeSingle();
      
      if (catData) {
        const span = document.createElement('span');
        span.innerText = catData.category_name.toLowerCase(); 
        span.className = 'category-badge';
        catDiv.appendChild(span);
      }
    }
  }

  // 5. Képek betöltése
  const imagesContainer = document.getElementById('images');
  
  if (data.image_path && data.image_path.length > 0) {
    data.image_path.forEach(path => {
      const { data: publicUrlData } = supabase.storage
        .from('graffiti-images')
        .getPublicUrl(path);

      const img = document.createElement('img');
      img.src = publicUrlData.publicUrl;
      // Klikk esemény közvetlenül a létrehozáskor
      img.addEventListener('click', toggleImageSize);
      imagesContainer.appendChild(img);
    });
  } else {
    imagesContainer.innerText = "Nincs feltöltött kép.";
  }

  // Admin funkciók
  const isAdmin = await checkAdmin();
  if (isAdmin) {
    const adminDiv = document.getElementById('admin-actions');
    const deleteBtn = document.createElement('button');
    deleteBtn.innerText = '🗑️';
    
    deleteBtn.onclick = async () => {
      if (!confirm('Biztosan törlöd? Ez nem vonható vissza.')) return;
      
      if (data.image_path && data.image_path.length > 0) {
          await supabase.storage.from('graffiti-images').remove(data.image_path);
      }
      const { error: dbErr } = await supabase.from('graffiti').delete().eq('id', data.id);

      if (dbErr) alert('Hiba: ' + dbErr.message);
      else { alert('Törölve.'); location.href = '/graffitis/index.html'; }
    };
    adminDiv.appendChild(deleteBtn);
  }

  // Leírás megjelenítés gomb
  const expandBtn = document.getElementById('expend-btn');
  expandBtn.onclick = () => {
    const descDiv = document.getElementById('description-display');
    const titleEl = document.getElementById('category-display');
    if (titleEl.classList.contains('hidden')) {
      titleEl.classList.remove('hidden');
      expandBtn.innerText = 'X';
    } else {
      titleEl.classList.add('hidden');
      expandBtn.innerText = '...';
    }
  };
}

// Külön függvény a képnyitáshoz a tisztább kódért
function toggleImageSize(e) {
  const img = e.target;
  const isEnlarged = img.classList.contains('enlarged');
  
  if (isEnlarged) {
    // Bezárás
    img.classList.remove('enlarged');
    document.body.classList.remove('scroll-lock');
  } else {
    // Kinyitás
    img.classList.add('enlarged');
    document.body.classList.add('scroll-lock');
  }
}

window.addEventListener('DOMContentLoaded', loadDetail);
</script>

</body>
</html>
